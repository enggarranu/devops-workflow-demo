# Server block untuk aplikasi demo.
#
# Dipasang ke /etc/nginx/conf.d/demo.conf oleh workflow. Default site nginx di port 80
# sengaja tidak disentuh, supaya tidak ada satu pun binding yang bentrok.
#
# PORT: 8080 di sini harus sama dengan env APP_PORT di .github/workflows/deploy.yml.
server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    # root menunjuk ke SYMLINK, bukan ke folder rilis.
    # nginx me-resolve path ini tiap request, jadi mengganti symlink langsung berlaku
    # di request berikutnya tanpa reload maupun restart.
    root  /var/www/demo/current;
    index index.html;

    # open_file_cache sengaja TIDAK dinyalakan. Kalau dinyalakan, nginx menyimpan file
    # descriptor hasil resolve symlink dan masih melayani rilis lama setelah swap
    # sampai cache-nya kedaluwarsa, yang membuat smoke test flaky.

    access_log /var/log/nginx/demo-access.log;
    error_log  /var/log/nginx/demo-error.log warn;

    location / {
        try_files $uri $uri/ =404;
    }

    # Endpoint murah untuk cek apakah nginx hidup, terpisah dari cek isi rilis.
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200   "ok\n";
    }
}
